<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Central Perk Cafe</title>
        <link rel="stylesheet" href="css/login.css"></link>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="main">
            <div class="left-section"></div>

            <div class="right-section">
                <div class="container">
                    <div id="logo-cluster">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9.33333 20C6.73333 20 4.52778 19.0944 2.71667 17.2833C0.905556 15.4722 0 13.2667 0 10.6667V2.66667C0 1.93333 0.261111 1.30556 0.783333 0.783333C1.30556 0.261111 1.93333 0 2.66667 0H19.3333C20.6222 0 21.7222 0.455556 22.6333 1.36667C23.5444 2.27778 24 3.37778 24 4.66667C24 5.95556 23.5444 7.05556 22.6333 7.96667C21.7222 8.87778 20.6222 9.33333 19.3333 9.33333H18.6667V10.6667C18.6667 13.2667 17.7611 15.4722 15.95 17.2833C14.1389 19.0944 11.9333 20 9.33333 20ZM2.66667 6.66667H16V2.66667H2.66667V6.66667ZM9.33333 17.3333C11.1778 17.3333 12.75 16.6833 14.05 15.3833C15.35 14.0833 16 12.5111 16 10.6667V9.33333H2.66667V10.6667C2.66667 12.5111 3.31667 14.0833 4.61667 15.3833C5.91667 16.6833 7.48889 17.3333 9.33333 17.3333ZM18.6667 6.66667H19.3333C19.8889 6.66667 20.3611 6.47222 20.75 6.08333C21.1389 5.69444 21.3333 5.22222 21.3333 4.66667C21.3333 4.11111 21.1389 3.63889 20.75 3.25C20.3611 2.86111 19.8889 2.66667 19.3333 2.66667H18.6667V6.66667ZM0 24V21.3333H21.3333V24H0Z" fill="#23160C"/>
                        </svg>
                        <div id="logo-area">Central Perk Cafe</div>
                    </div>

                    <div id="header-margin">
                        <div id="header">
                            <div id="heading1">Welcome Back!</div>
                            <div id="heading2">We've missed you. Login to your account to continue your coffee journey.</div>
                        </div>
                    </div>

                    <div id="form">
                        <form>
                            <div class="input-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="someone@example.com">
                            </div>

                            <div class="input-group">
                                <div class="password-labels">
                                    <label for="password">Password</label>
                                    <label for="password" id="forgot-password">Forgot Password?</label>
                                </div>
                                <div class="input-wrapper-password">
                                    <input type="password" id="password" placeholder="Password">
                                    <svg width="22" height="15" viewBox="0 0 22 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11 12C12.25 12 13.3125 11.5625 14.1875 10.6875C15.0625 9.8125 15.5 8.75 15.5 7.5C15.5 6.25 15.0625 5.1875 14.1875 4.3125C13.3125 3.4375 12.25 3 11 3C9.75 3 8.6875 3.4375 7.8125 4.3125C6.9375 5.1875 6.5 6.25 6.5 7.5C6.5 8.75 6.9375 9.8125 7.8125 10.6875C8.6875 11.5625 9.75 12 11 12ZM11 10.2C10.25 10.2 9.6125 9.9375 9.0875 9.4125C8.5625 8.8875 8.3 8.25 8.3 7.5C8.3 6.75 8.5625 6.1125 9.0875 5.5875C9.6125 5.0625 10.25 4.8 11 4.8C11.75 4.8 12.3875 5.0625 12.9125 5.5875C13.4375 6.1125 13.7 6.75 13.7 7.5C13.7 8.25 13.4375 8.8875 12.9125 9.4125C12.3875 9.9375 11.75 10.2 11 10.2ZM11 15C8.56667 15 6.35 14.3208 4.35 12.9625C2.35 11.6042 0.9 9.78333 0 7.5C0.9 5.21667 2.35 3.39583 4.35 2.0375C6.35 0.679167 8.56667 0 11 0C13.4333 0 15.65 0.679167 17.65 2.0375C19.65 3.39583 21.1 5.21667 22 7.5C21.1 9.78333 19.65 11.6042 17.65 12.9625C15.65 14.3208 13.4333 15 11 15ZM11 13C12.8833 13 14.6125 12.5042 16.1875 11.5125C17.7625 10.5208 18.9667 9.18333 19.8 7.5C18.9667 5.81667 17.7625 4.47917 16.1875 3.4875C14.6125 2.49583 12.8833 2 11 2C9.11667 2 7.3875 2.49583 5.8125 3.4875C4.2375 4.47917 3.03333 5.81667 2.2 7.5C3.03333 9.18333 4.2375 10.5208 5.8125 11.5125C7.3875 12.5042 9.11667 13 11 13Z" fill="#D2C4BC"/>
                                    </svg>
                                </div>
                            </div>

                            <div class="input-group-checkbox">   
                                <input type="checkbox" id="terms-conditions">
                                <label for="terms-conditions">Remember for 30 days</label>
                            </div>

                            <div id="login-button">
                                <button id="login">LOGIN</button>
                            </div>

                            <div id="button-seperator">
                                <hr>
                                <div id="or">OR</div>
                                <hr>
                            </div>

                            <div id="google-button">
                                <button id="google">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M18.8 10.2083C18.8 9.55825 18.7417 8.93325 18.6333 8.33325H10V11.8833H14.9333C14.7167 13.0249 14.0667 13.9916 13.0917 14.6416V16.9499H16.0667C17.8 15.3499 18.8 12.9999 18.8 10.2083Z" fill="#1D1B1A"/>
                                        <path d="M9.99998 19.1667C12.475 19.1667 14.55 18.35 16.0667 16.95L13.0917 14.6417C12.275 15.1917 11.2333 15.525 9.99998 15.525C7.61665 15.525 5.59165 13.9167 4.86665 11.75H1.81665V14.1167C3.32498 17.1083 6.41665 19.1667 9.99998 19.1667Z" fill="#1D1B1A"/>
                                        <path d="M4.86659 11.7416C4.68325 11.1916 4.57492 10.6083 4.57492 9.99993C4.57492 9.3916 4.68325 8.80827 4.86659 8.25827V5.8916H1.81659C1.19159 7.12493 0.833252 8.5166 0.833252 9.99993C0.833252 11.4833 1.19159 12.8749 1.81659 14.1083L4.19159 12.2583L4.86659 12.5749V11.7416Z" fill="#1D1B1A"/>
                                        <path d="M9.99998 4.48325C11.35 4.48325 12.55 4.94992 13.5083 5.84992L16.1333 3.22492C14.5417 1.74159 12.475 0.833252 9.99998 0.833252C6.41665 0.833252 3.32498 2.89159 1.81665 5.89159L4.86665 8.25825C5.59165 6.09159 7.61665 4.48325 9.99998 4.48325Z" fill="#1D1B1A"/>
                                    </svg>
                                    <div>Continue with Google</div>
                                </button>
                            </div>
                        </form>
                    </div>

                    <div id="bottom-links">
                        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                    </div>
                </div>

            </div>
        </div>

    </body>
</html>
