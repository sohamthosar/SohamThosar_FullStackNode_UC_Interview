<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Say My Name</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="main">
            <h1 class="title">Say My Name</h1>
            <div class="description">Drop your name. Pick how many chars. Get your alias.</div>
            <div class="form">
                <div class="input-wrapper">
                    <label for="name">YOUR NAME</label>
                    <input type="text" id="name" placeholder="e.g. Alex">
                </div>
                <div class="input-wrapper">
                    <label for="chars">CHARACTERS TO EXTRACT</label>
                    <input type="number" id="chars" placeholder="Enter a number">
                </div>
                <div class="generate-button">
                    <button id="generate">Generate</button>
                </div>
            </div>
        </div>

        <div class="output-wrapper">
            <div class="output-1"></div>
            <div class="output-2"></div>
            <div class="output-3"></div>
        </div>

        <script src="js/script.js"></script>
    </body>

</html>
